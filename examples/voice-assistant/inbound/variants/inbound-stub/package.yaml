# Deployment package labels — one standalone authoring unit once composed with ../../shared:
#   sutra package <this dir> --overlay examples/voice-assistant/inbound/shared
# seals one content-addressed .sutra archive. An overlay layer may not carry package.yaml, so each
# variant holds its own copy; the labels are the same (the variants are alternative builds of one
# module — deploy one at a time).
labels:
  "module": "voice-assistant"
  "tenant": "default"
  "version": "1.0.0"
engine:
  minContract: 1
