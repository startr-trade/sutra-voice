# cargo-audit configuration for the sutra-voice Rust workspace (paired with deny.toml). The same
# accepted advisories as the engine (engine/rust/.cargo/audit.toml): every one is reached through
# an engine crate this workspace links, and its triage is in deny.toml.
#
# `cargo audit` (run by `make audit`) scans Cargo.lock against the RustSec DB. Unmaintained
# advisories stay as WARNINGS here (non-fatal) — the "unmaintained = WARN" posture — so they
# remain visible on every run. Only VULNERABILITY advisories that have been triaged and
# accepted / tracked are listed below; the full rationale is in deny.toml. Keep this list
# identical to deny.toml's `[advisories] ignore`.

[advisories]
ignore = [
    "RUSTSEC-2026-0387",  # crypto-bigint 0.5.5 timing (via jsonwebtoken EC verify only; no fix upstream)
    "RUSTSEC-2023-0071",  # rsa 0.9.10 Marvin timing (SHIPPED via sqlx-mysql; no fix; trusted DB link)
    "RUSTSEC-2026-0099",  # rustls-webpki 0.101.7 name-constraint (MSSQL/tiberius TLS; upstream-blocked)
    "RUSTSEC-2026-0098",  # rustls-webpki 0.101.7 URI name-constraint (MSSQL/tiberius TLS; upstream-blocked)
    "RUSTSEC-2026-0104",  # rustls-webpki 0.101.7 CRL-parse panic (MSSQL/tiberius TLS; upstream-blocked)
    "RUSTSEC-2026-0346",  # rustls 0.21.12 (MSSQL/tiberius TLS; 0.23 line already on 0.23.46)
    "RUSTSEC-2026-0349",  # rustls 0.21.12 (MSSQL/tiberius TLS; 0.23 line already on 0.23.46)
    "RUSTSEC-2026-0382",  # rustls-webpki 0.101.7 (MSSQL/tiberius TLS; 0.103 line already on 0.103.16)
    # libsqlite3-sys 0.30.1, SQLite WAL page-size memory exposure (published 2026-10-30; fixed in
    # 0.39). LOCK-ONLY: sqlx declares its optional sqlite driver through a weak feature, so the crate
    # is in Cargo.lock, but no workspace crate enables sqlite and it is compiled into nothing
    # (`cargo tree -i libsqlite3-sys --target all --all-features` is empty). No sqlx release allows
    # 0.39 yet. cargo-deny resolves the real graph and does not see it, which is why this entry is
    # here and not in deny.toml. The engine carries the same entry. Drop it when sqlx allows 0.39.
    "RUSTSEC-2026-0459",
]
