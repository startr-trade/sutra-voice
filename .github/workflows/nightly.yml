name: Nightly (tier-2 Docker suites + the worker)

# The Docker tier, kept OUT of the PR gate (see ci.yml), like the engine repository's nightly.yml.
# Best-effort nightly signal, not a merge gate:
#
#   tier2  — `make test-docker`: the voice suites, each with a PBX (rustpbx) or an SFU (LiveKit),
#            SIPp or the WebRTC participant, the stub model, MinIO and PostgreSQL. They boot the
#            voice engine image (`sutra-voice-engine:dev`) and the worker image
#            (`sutra-webrtc-worker:dev`), neither of which exists on a hosted runner, so both are
#            built here first and loaded into the local daemon, where testcontainers finds them.
#   worker — `make worker-lint worker-test`: fmt, clippy -D warnings and the unit tests of the
#            WebRTC worker, in its Docker toolchain (libwebrtc + clang 21), plus cargo deny/audit.

on:
  schedule:
    - cron: "27 2 * * *" # 02:27 UTC daily
  workflow_dispatch:
    inputs:
      crate:
        description: "Narrow tier-2 to one crate (make test-docker P=<crate>); blank = whole workspace"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-tier2
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # See ci.yml: debug info blows the runner's disk. Tier-2 also pulls container images onto it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  tier2:
    name: tier-2 (make test-docker)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: tier2
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The fast `release-it` profile, as `make image` builds it locally.
      - name: Build the voice engine image (sutra-voice-engine:dev)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            CARGO_PROFILE=release-it
          tags: sutra-voice-engine:dev
          push: false
          load: true
          cache-from: type=gha,scope=nightly-voice-release-it
          cache-to: type=gha,mode=max,scope=nightly-voice-release-it
      - name: Build the worker image (sutra-webrtc-worker:dev)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./tools/sutra-webrtc-worker
          file: ./tools/sutra-webrtc-worker/Dockerfile
          tags: sutra-webrtc-worker:dev
          push: false
          load: true
          cache-from: type=gha,scope=trivy-image-sutra-webrtc-worker
      - name: Verify the images
        run: |
          docker image inspect sutra-voice-engine:dev --format 'voice engine image: {{.Id}}'
          docker image inspect sutra-webrtc-worker:dev --format 'worker image: {{.Id}}'
      - name: make test-docker
        env:
          CRATE: ${{ github.event.inputs.crate }}
        run: |
          if [ -n "$CRATE" ]; then
            make test-docker P="$CRATE"
          else
            make test-docker
          fi
      # Reap anything a killed run leaked (the engine's dev-docker-cleanup.sh, from the submodule).
      - name: Reap leaked fixtures
        if: always()
        run: make docker-clean

  worker:
    name: worker (make worker-lint worker-test)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit,cargo-deny
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - name: make worker-lint worker-test
        run: make worker-lint worker-test
