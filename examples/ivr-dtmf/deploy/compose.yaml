# Run the ivr-dtmf example locally: the engine, PostgreSQL, rustpbx as the PBX, SIPp as the
# stand-in carrier and as the phones of extensions 200-203. Nothing to edit for a local run.
#
#   sutra package examples/ivr-dtmf/package --out examples/ivr-dtmf/deploy/deployments
#   docker compose -f examples/ivr-dtmf/deploy/compose.yaml up -d --build
#
#   # a call: from an unknown number, press 2 (support, customers only), then the PIN 4321 #
#   docker compose -f examples/ivr-dtmf/deploy/compose.yaml run --rm caller \
#       pbx:5060 +15550009999 2500ms 2 2500ms 4321#
#
# The project name is explicit so this stack never collides with one that would default to
# `deploy`. Every name in here (engine, pbx) is what the package and rustpbx/config.toml address.

name: sutra-ivr-dtmf

services:
  engine:
    image: ${SUTRA_ENGINE_IMAGE:-ghcr.io/startr-trade/sutra-voice:0.6.0}
    # PostgreSQL restarts once after its first-boot init scripts; an engine that connected in
    # that window exits and is simply started again.
    restart: on-failure
    environment:
      SUTRA_DEPLOYMENTS_DIR: /deployments
      SUTRA_HTTP_PORT: "8080"
      SUTRA_DATASOURCE_URL: postgres://engine-db:5432/sutra
      SUTRA_DATASOURCE_USERNAME: ${ENGINE_DB_USER:-sutra_engine}
      SUTRA_DATASOURCE_PASSWORD: ${ENGINE_DB_PASSWORD:-sutra-dev-only}

      # THE TRUNK'S LINES: the capacity pool the menu's number takes a slot of per call.
      SUTRA_CAPACITY_POOLS: trunk-main
      SUTRA_CAPACITY_POOLS_TRUNK_MAIN_SLOTS: ${TRUNK_LINES:-4}

      # THE GATEWAY (the voip transport; engine-wide, one PBX per engine).
      SUTRA_VOIP_GATEWAY: rustpbx
      SUTRA_VOIP_RWI_URL: ws://pbx:8080/rwi/v1           # wss:// for a PBX behind TLS
      SUTRA_VOIP_RWI_TOKEN: env:PBX_RWI_TOKEN            # references, never literals
      SUTRA_VOIP_MEDIA_TOKEN: env:VOIP_MEDIA_TOKEN
      SUTRA_VOIP_PUBLIC_MEDIA_URL: ws://engine:8080      # how the PBX reaches this engine
      # THE PROMPTS: `play` with {prompt: "ivr-dtmf/menu"} plays /prompts/ivr-dtmf/menu.wav.
      SUTRA_VOIP_PROMPTS_DIR: /prompts
      # Must match rustpbx/config.toml. Dev-only values: replace both outside a local run.
      PBX_RWI_TOKEN: ${PBX_RWI_TOKEN:-dev-only-rwi-token}
      VOIP_MEDIA_TOKEN: ${VOIP_MEDIA_TOKEN:-dev-only-media-token}

      # What datastores.yaml names by reference.
      IVR_DB_URL: postgres://engine-db:5432/sutra
      IVR_DB_USER: ${ENGINE_DB_USER:-sutra_engine}
      IVR_DB_PASSWORD: ${ENGINE_DB_PASSWORD:-sutra-dev-only}
    volumes:
      - ${DEPLOYMENTS_DIR:-./deployments}:/deployments:ro
      - ../prompts:/prompts/ivr-dtmf:ro
    ports:
      # Loopback only, dynamic by default (`docker compose … port engine 8080`).
      - "127.0.0.1:${ENGINE_HOST_PORT:-}:8080"
    depends_on:
      engine-db:
        condition: service_healthy
      pbx:
        condition: service_started

  # The PBX. Pinned BY DIGEST: the project publishes only a moving `latest` tag. This digest is
  # rustpbx 0.5.1 (da5159a), the build the example and the engine's tests were run against.
  pbx:
    image: ghcr.io/restsend/rustpbx@sha256:c8c9258d27ed11d368fd94e3e9d47b5e0f03973b57106a00ece9fbbd4b5ea8b4
    command: ["--conf", "/app/config.toml"]
    volumes:
      - ./rustpbx/config.toml:/app/config.toml:ro
    # With a real trunk or real phones, publish SIP and exactly the RTP range of config.toml, e.g.
    # ports: ["5060:5060/udp", "20000-20019:20000-20019/udp"]

  # The phones of the extensions the menu transfers to: each registers, then answers.
  ext-200:
    build: ./sipp
    image: sutra-ivr-sipp:dev
    entrypoint: ["/ivr/extension.sh"]
    command: ["pbx:5060", "200", "dev-only-ext-200"]
    depends_on: [pbx]
  ext-201:
    image: sutra-ivr-sipp:dev
    entrypoint: ["/ivr/extension.sh"]
    command: ["pbx:5060", "201", "dev-only-ext-201"]
    depends_on: [pbx, ext-200]
  ext-202:
    image: sutra-ivr-sipp:dev
    entrypoint: ["/ivr/extension.sh"]
    command: ["pbx:5060", "202", "dev-only-ext-202"]
    depends_on: [pbx, ext-200]
  ext-203:
    image: sutra-ivr-sipp:dev
    entrypoint: ["/ivr/extension.sh"]
    command: ["pbx:5060", "203", "dev-only-ext-203"]
    depends_on: [pbx, ext-200]

  # The stand-in carrier's caller: one call per `docker compose run --rm caller <pbx> <from> <keys>…`.
  caller:
    image: sutra-ivr-sipp:dev
    profiles: ["call"]
    entrypoint: ["/ivr/call.sh"]
    command: ["pbx:5060", "+15557654321", "2500ms", "1"]
    depends_on: [ext-200]

  engine-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sutra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-bootstrap-dev-only}
      ENGINE_DB_USER: ${ENGINE_DB_USER:-sutra_engine}
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:-sutra-dev-only}
    volumes:
      - ./engine-db-init.sh:/docker-entrypoint-initdb.d/10-engine-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sutra"]
      interval: 2s
      timeout: 3s
      retries: 30
