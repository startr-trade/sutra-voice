[package]
name = "sutra-transport-voip"
description = "The VoIP (turn-based voice) transport: a media WebSocket served over the engine's shared HTTP listener (a generic media-stream protocol plus a PCM16 bridge framing), energy-VAD turn detection with real-time paced playback and barge-in, deterministic per-turn acoustic features, number binding, listen-only calls (recorded to an object store, sealed, and transcribed live through an `llm` channel's audio session), and a pluggable gateway control client (a reconnecting RWI WebSocket client for rustpbx, or none). Self-registers a TransportFactory, a ReplySinkFactory and an InlineCallerFactory for the `voip` scheme via inventory."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sutra-channels = { workspace = true }
sutra-transport-spi = { workspace = true }
# Listen-only calls: the live transcription session (opened through an `llm` channel), the object
# store recordings go to, and the envelope encryption they are sealed with.
sutra-llm-spi = { workspace = true }
sutra-objectstore = { workspace = true }
sutra-crypto = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["ws", "query", "tokio", "http1"] }
# Handshake only: the RWI client opens its own TCP (and, for `wss://`, TLS) stream and hands it
# to `client_async` — the same rustls + ring + native-roots build the HTTPS client uses.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
inventory = "0.3.24"
async-trait = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v5"] }
# Only to name the SPI's uniform spawn signature (`Option<PgPool>`); this transport uses no
# datasource. Same sqlx build as the rest of the tree so the `PgPool` type matches.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros", "fs"] }

[dev-dependencies]
# Tests only: the `llm` channels the transcription and analysis are served through, built the
# way the `llm` transport builds them (the library itself reaches them through sutra-llm-spi).
sutra-transport-llm = { workspace = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "test-util"] }
