name: Trivy

# The WEEKLY watch: what changed outside the code. Once a week this scans the tree (a lockfile that
# was clean on Monday is not clean on Friday) and the images users pull, the newest published
# release of both, on both architectures. It builds nothing. Locally: `make scan-deps`,
# `make scan-image`, `make worker-scan` (scripts/security-scan.sh).
#
# The gates are elsewhere: ci.yml's scan-deps job on every commit, and release.yml scanning each
# image before its tag exists. Until 2026-11 this workflow also built both images on every push to
# main, beside CI, only to scan them: a release-profile compile per commit that no release reused.

on:
  schedule:
    - cron: "51 4 * * 1" # weekly, Monday 04:51 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "Image version to scan (e.g. 0.6.0); blank = the newest published release"
        required: false

permissions:
  contents: read

jobs:
  # Fast: the repo tree — vulnerable dependencies (both Cargo.lock files), leaked secrets, IaC
  # misconfiguration. No submodule checkout, deliberately: `make scan-deps` scans a checkout copy
  # without `engine/` too, because the engine tree is scanned by the engine's own workflow against
  # its own triage. The engine crates' dependencies are still covered — they are in rust/Cargo.lock.
  fs:
    name: filesystem (deps · secrets · IaC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          # EVERY severity is reported. A defect has no level: either the tree is clean or it is
          # not. The only sanctioned suppression is "no fix available", recorded with its
          # justification (and an expiry date) in .trivyignore.yaml.
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          # Passed EXPLICITLY: the action only adds --ignorefile when this input is set.
          trivyignores: .trivyignore.yaml
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # The published images, pulled from ghcr.io by Trivy itself (the packages are public), one leg
  # per image and architecture: each is its own set of OS packages and its own binaries.
  image:
    name: published ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [sutra-voice, sutra-webrtc-worker]
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Resolve the image to scan
        id: img
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ github.event.inputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          version="${WANTED:-}"
          if [ -z "$version" ]; then
            # The newest published release, pre-releases included: that is what was shipped last.
            tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')"
            [ -n "$tag" ] || { echo "::error::no published release to scan"; exit 1; }
            version="${tag#v}"
          fi
          echo "ref=ghcr.io/startr-trade/${IMAGE}:${version}" >> "$GITHUB_OUTPUT"
          echo "scanning ghcr.io/startr-trade/${IMAGE}:${version} (${{ matrix.platform }})"
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          scan-type: image
          image-ref: ${{ steps.img.outputs.ref }}
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.image }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}

# SEVERITY POLICY (the engine's). Both scans report EVERY severity. The one sanctioned suppression
# is "upstream has no fix", and every such entry lives in .trivyignore.yaml with the reason
# written next to it AND an expiry date. When an entry expires the finding returns and must be
# re-triaged.
#
# Reproduce a run locally with:
#   make scan-deps
#   trivy image --platform linux/amd64 ghcr.io/startr-trade/sutra-voice:<version>
#   trivy image --platform linux/amd64 ghcr.io/startr-trade/sutra-webrtc-worker:<version>
