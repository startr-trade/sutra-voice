# Run the meeting-assistant example locally: the engine, PostgreSQL, an S3-compatible object store
# (MinIO) for the recordings, a stub model server, rustpbx as the gateway and SIPp as the stand-in
# conference. Nothing to edit for the stub run.
#
#   sutra package examples/meeting-assistant/variants/meeting-stub \
#       --overlay examples/meeting-assistant/shared --out examples/meeting-assistant/deploy/deployments
#   docker compose -f examples/meeting-assistant/deploy/compose.yaml up -d --build
#
#   # "join this meeting": the bot dials the conference, enters the PIN, announces itself, listens
#   curl -X POST -H 'X-Api-Key: dev-only-meeting-key' -H 'Content-Type: application/json' \
#        -d '{"meetingId":"M-1","title":"Launch plan review","dialIn":"+15550142000","pin":"4321",
#             "participants":[{"name":"Alex Chen","role":"internal"},{"name":"Sam Rivera","role":"external"}]}' \
#        http://127.0.0.1:$(docker compose -f examples/meeting-assistant/deploy/compose.yaml port engine 8080 | cut -d: -f2)/channels/join
#
# The project name is explicit so this stack never collides with one that would default to
# `deploy`. Every name in here (engine, pbx, conference, model-stub, recordings) is what the
# package and rustpbx/config.toml address.

name: sutra-meeting-assistant

services:
  engine:
    image: ${SUTRA_ENGINE_IMAGE:-ghcr.io/startr-trade/sutra-voice:0.6.0}
    # PostgreSQL restarts once after its first-boot init scripts; an engine that connected in
    # that window exits and is simply started again.
    restart: on-failure
    environment:
      SUTRA_DEPLOYMENTS_DIR: /deployments
      SUTRA_HTTP_PORT: "8080"
      SUTRA_DATASOURCE_URL: postgres://engine-db:5432/sutra
      SUTRA_DATASOURCE_USERNAME: ${ENGINE_DB_USER:-sutra_engine}
      SUTRA_DATASOURCE_PASSWORD: ${ENGINE_DB_PASSWORD:-sutra-dev-only}
      # The durable audit of record (audit_event): the meeting's events carry the recording's
      # reference (`<q:audit capture="media">`).
      SUTRA_AUDIT_SQL: "true"

      # THE TRUNK'S LINES (a capacity pool; the bot's call holds one until it hangs up).
      SUTRA_CAPACITY_POOLS: trunk-main
      SUTRA_CAPACITY_POOLS_TRUNK_MAIN_SLOTS: ${TRUNK_LINES:-2}

      # THE GATEWAY (the voip transport; engine-wide, one PBX per engine).
      SUTRA_VOIP_GATEWAY: rustpbx
      SUTRA_VOIP_RWI_URL: ws://pbx:8080/rwi/v1           # wss:// for a PBX behind TLS
      SUTRA_VOIP_RWI_TOKEN: env:PBX_RWI_TOKEN            # references, never literals
      SUTRA_VOIP_MEDIA_TOKEN: env:VOIP_MEDIA_TOKEN
      SUTRA_VOIP_PUBLIC_MEDIA_URL: ws://engine:8080      # how the PBX reaches this engine
      SUTRA_VOIP_TRUNK: conference                       # the PBX trunk the bot dials out on
      # TOLL-FRAUD CONTROLS: originate dials nothing until this lists what it may — here, the
      # example's (fictional) conference dial-in numbers.
      SUTRA_VOIP_ORIGINATE_ALLOW: "+1555*"
      SUTRA_VOIP_ORIGINATE_HOME_PREFIX: "+1"
      SUTRA_VOIP_PROMPTS_DIR: /prompts                   # the consent announcement
      PBX_RWI_TOKEN: ${PBX_RWI_TOKEN:-dev-only-rwi-token}
      VOIP_MEDIA_TOKEN: ${VOIP_MEDIA_TOKEN:-dev-only-media-token}

      # THE RECORDINGS: an S3-compatible bucket, each recording sealed (envelope encryption) under
      # the key-encryption key below. Dev-only credentials and key: replace them outside a local
      # run (a secret: / vault: reference in production).
      SUTRA_VOIP_RECORDING_STORE: s3://meeting-recordings/calls
      SUTRA_VOIP_RECORDING_ENDPOINT: http://recordings:9000
      SUTRA_VOIP_RECORDING_REGION: us-east-1
      SUTRA_VOIP_RECORDING_ACCESS_KEY: env:RECORDINGS_ACCESS_KEY
      SUTRA_VOIP_RECORDING_SECRET_KEY: env:RECORDINGS_SECRET_KEY
      SUTRA_VOIP_RECORDING_KEK: env:RECORDINGS_KEK
      SUTRA_VOIP_RECORDING_CREATE_BUCKET: "true"
      RECORDINGS_ACCESS_KEY: ${RECORDINGS_ACCESS_KEY:-dev-only-access}
      RECORDINGS_SECRET_KEY: ${RECORDINGS_SECRET_KEY:-dev-only-secret-key}
      RECORDINGS_KEK: ${RECORDINGS_KEK:-dev-only-recordings-kek-change-me}

      # What channels.yaml and datastores.yaml name by reference.
      MEETING_API_KEY: ${MEETING_API_KEY:-dev-only-meeting-key}
      MEETING_DB_URL: postgres://engine-db:5432/sutra
      MEETING_DB_USER: ${ENGINE_DB_USER:-sutra_engine}
      MEETING_DB_PASSWORD: ${ENGINE_DB_PASSWORD:-sutra-dev-only}
      LLM_API_KEY: ${LLM_API_KEY:-stub-not-a-real-key}
      # The live variant's key; an `env:` reference to an unset variable fails the channel at
      # load, so it is always defined. Export the real one before `up`.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-set}
    volumes:
      - ${DEPLOYMENTS_DIR:-./deployments}:/deployments:ro
      - ../prompts:/prompts/meeting-assistant:ro
    ports:
      # Loopback only, dynamic by default (`docker compose … port engine 8080`).
      - "127.0.0.1:${ENGINE_HOST_PORT:-}:8080"
    depends_on:
      engine-db:
        condition: service_healthy
      recordings:
        condition: service_started
      model-stub:
        condition: service_started
      pbx:
        condition: service_started

  # The gateway. Pinned BY DIGEST: the project publishes only a moving `latest` tag. This digest is
  # rustpbx 0.5.1 (da5159a), the build the example and the engine's tests were run against.
  pbx:
    image: ghcr.io/restsend/rustpbx@sha256:c8c9258d27ed11d368fd94e3e9d47b5e0f03973b57106a00ece9fbbd4b5ea8b4
    command: ["--conf", "/app/config.toml"]
    volumes:
      - ./rustpbx/config.toml:/app/config.toml:ro

  # The stand-in conference: answers the bot's calls (up to 100), plays the conversation, hangs up.
  conference:
    build: ./sipp
    image: sutra-meeting-sipp:dev
    command: ["-sf", "/meeting/conference.xml", "-p", "5060", "-mp", "6000", "-m", "100", "-nostdin"]

  # The recordings bucket: MinIO, as built by the community (upstream no longer publishes images);
  # pinned by digest. Any S3-compatible store works — point SUTRA_VOIP_RECORDING_* at it.
  recordings:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${RECORDINGS_ACCESS_KEY:-dev-only-access}
      MINIO_ROOT_PASSWORD: ${RECORDINGS_SECRET_KEY:-dev-only-secret-key}

  model-stub:
    image: python:3.12-alpine
    command: ["python3", "/stub/model-stub.py", "8000"]
    volumes:
      - ../../model-stub:/stub:ro

  engine-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sutra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-bootstrap-dev-only}
      ENGINE_DB_USER: ${ENGINE_DB_USER:-sutra_engine}
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:-sutra-dev-only}
    volumes:
      - ./engine-db-init.sh:/docker-entrypoint-initdb.d/10-engine-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sutra"]
      interval: 2s
      timeout: 3s
      retries: 30
